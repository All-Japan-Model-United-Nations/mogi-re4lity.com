name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

# 同時実行制御: 同じブランチの古いデプロイをキャンセル
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Build the Docusaurus site
        run: npm run build

      - name: Resolve the locked Wrangler version
        id: wrangler-version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const locked = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages['node_modules/wrangler'].version;
          const installed = JSON.parse(fs.readFileSync('node_modules/wrangler/package.json', 'utf8')).version;
          if (installed !== locked || !/^\d+\.\d+\.\d+$/.test(installed)) {
            throw new Error('Installed Wrangler must match package-lock.json');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${installed}\n`);
          NODE

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # インストール済みCLIとlockfileの一致を確認した版を指定する。
          wranglerVersion: ${{ steps.wrangler-version.outputs.version }}
          command: deploy
